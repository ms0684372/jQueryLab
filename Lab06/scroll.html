<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../Style/style.css" />
    <style>
      .box {
        width: 200px;
        height: 200px;
        background-color: black;
        overflow: auto;
      }
      .con {
        width: 400px;
        height: 400px;
        background-color: lightblue;
      }
      body {
        height: 300vh;
      }
      .progress {
        background-color: lightgray;
        height: 30px;
        width: 100%;
        position: fixed;
        left: 0;
        top: 0;
      }
      .progressValue {
        background-color: lightblue;
        height: 30px;
        width: 50%;
      }
      .top {
        position: fixed;
        right: 10px;
        bottom: 10px;
        background-color: lightblue;
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Scroll</h1>
    </header>
    <div class="container">
      <div class="progress">
        <div class="progressValue"></div>
      </div>
      <div class="box">
        <div class="con"></div>
      </div>

      <div class="top">TOP</div>
    </div>
    <script src="../jquery-4.0.0.js"></script>
    <script>
      $(function () {
        //js code
        const scrollH = $("body").height() - $(window).height();
        console.log(
          `wh:${$(window).height()}, bh:${$("body").height()}, scrollH:${scrollH}`,
        );

        $(window).scroll(function (e) {
          let value = Math.round(($(window).scrollTop() / scrollH) * 100);
          if (value > 100) {
            value = 100;
          }
          $(".progressValue").css("width", `${value}%`);
          $(".progressValue").text(`${value}%`);
          console.log(value);
        });

        let a = $(".box").scroll(function () {
          console.log(
            `scrllTop:${$(this).scrollTop()}, scrollLeft:${$(this).scrollLeft()}`,
          );
        });

        $(".top").click(function () {
          $(window).scrollTop(0);
        });
      });
    </script>
  </body>
</html>
