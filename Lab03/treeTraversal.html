<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../Style/style.css" />
    <style>
      table {
        width: 500px;
        height: 500px;
        border: 2px solid black;
        margin: auto;
      }
      td {
        width: 90px;
        height: 90px;
        border: 1px solid black;
        text-align: center;
      }
      .box {
        width: 50px;
        height: 50px;
        background-color: pink;
        border-radius: 50%;
        margin: auto;
        display: flex;
      }
      .box2 {
        width: 25px;
        height: 25px;
        background-color: red;
        border-radius: 50%;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Tree Traversal</h1>
    </header>
    <div class="container">
      <table>
        <tr>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td>
            <div class="box">
              <div class="box2"></div>
            </div>
          </td>
          <td></td>
          <td></td>
        </tr>
        <tr>
          <td>
            not test
            <div class="box">
              <div class="box2"></div>
            </div>
          </td>
          <td></td>
          <td></td>
          <td class="not">not</td>
          <td></td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td>
            prev test
            <div class="box">
              <div class="box2"></div>
            </div>
          </td>
        </tr>
      </table>
    </div>
    <script src="../jquery-4.0.0.js"></script>
    <script>
      //js code
      $(function () {
        $("td").on("click", function () {
          //children只會找一層
          $(this).children().css("background", "lightblue");

          //find 會找好幾層
          $(this).find(".box2").css("background", "lightgreen");

          // $(this).next().css("background", "pink");
          // $(this).nextAll().css("background", "brown");
          // $(this).nextUntil(".not").css("background", "lightblue");

          // $(this).prev().css("background", "pink");
          // $(this).prevAll().css("background", "brown");
          // $(this).prevUntil(".not").css("background", "lightblue");

          //end() 回到初始的位置
          // $(this).css("background", "white").next().css("background", "lightblue").prev().prev().css("background", "lightgreen");
          // $(this).css("background", "white").next().css("background", "lightblue").end().prev().css("background", "lightgreen");

          //siblings()
          $(this)
            .css("background", "white")
            .siblings()
            .css("background", "pink");
        });

        // $(".box").on("click", function () {
        //   //parent()
        //   $(this).parent().css("background", "pink");
        //   console.log($(this).parent());
        //   $(this).closest("tr").css("background", "red");
        // });
      });
    </script>
  </body>
</html>
